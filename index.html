<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's Gold, Petrol & Diesel Rate - Kerala</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .card {
    background: #16213e;
    border: 1px solid #444;
    border-radius: 12px;
    padding: 40px 60px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    max-width: 700px;
    width: 100%;
    min-width: 0;
    margin: 20px auto;
    box-sizing: border-box;
  }
  h1 { margin-bottom: 25px; color: #eee; }
  .tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
  }
  .tab-btn {
    background: transparent;
    border: 1px solid #444;
    color: #aaa;
    padding: 10px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1em;
    transition: all 0.15s ease;
  }
  .tab-btn.gold.active { border-color: #e6b800; color: #ffd700; box-shadow: 0 0 10px rgba(230, 184, 0, 0.3); }
  .tab-btn.fuel.active { border-color: #4caf50; color: #8bd98b; box-shadow: 0 0 10px rgba(76, 175, 80, 0.3); }
  .panel { display: none; }
  .panel.active { display: block; }

  .panel.gold h2 { color: #e6b800; }
  .panel.fuel h2 { color: #4caf50; }

  .price { font-size: 2.5em; font-weight: bold; color: #ffd700; margin: 20px 0; }
  .price-row { display: flex; justify-content: space-around; margin: 20px 0; }
  .price-block .price { font-size: 2em; color: #8bd98b; margin: 10px 0; }

  .label { color: #aaa; font-size: 0.9em; }
  .error { color: #ff6b6b; }
  a { color: #e6b800; }
  .panel.fuel a { color: #4caf50; }

  .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; min-width: 480px; border-collapse: collapse; margin-top: 20px; text-align: left; }
  th, td { padding: 8px 12px; border-bottom: 1px solid #2a2a4a; white-space: nowrap; }
  .panel.gold th { color: #e6b800; }
  .panel.fuel th { color: #4caf50; }
  tr.today-row td { font-weight: bold; }
  .panel.gold tr.today-row td { color: #ffd700; }
  .panel.fuel tr.today-row td { color: #8bd98b; }
  tr.high-row { background: rgba(255, 107, 107, 0.10); box-shadow: inset 4px 0 0 #ff6b6b; }
  tr.low-row { background: rgba(139, 217, 139, 0.10); box-shadow: inset 4px 0 0 #8bd98b; }
  .note { color: #aaa; font-size: 0.8em; }
  .loading { color: #aaa; }
  .up { color: #ff6b6b; }
  .down { color: #8bd98b; }
  .flat { color: #aaa; }

  .chart-wrap { position: relative; margin-top: 10px; }
  .chart-svg { width: 100%; height: auto; display: block; overflow: hidden; }
  .chart-svg:focus { outline: none; }
  .chart-svg:focus-visible { outline: 2px solid #ffd700; outline-offset: 4px; border-radius: 4px; }
  .chart-line { fill: none; stroke: #ffd700; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart-area { fill: url(#goldAreaGradient); }
  .chart-grid { stroke: #2a2a4a; stroke-width: 1; }
  .chart-axis-text { fill: #aaa; font-size: 11px; }
  .chart-crosshair { stroke: #888; stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; opacity: 0; }
  .chart-dot { fill: #ffd700; stroke: #16213e; stroke-width: 2; }
  .chart-end-label { fill: #eee; font-size: 12px; font-weight: bold; }
  .chart-dot-high { fill: #ff6b6b; stroke: #16213e; stroke-width: 2; }
  .chart-dot-low { fill: #8bd98b; stroke: #16213e; stroke-width: 2; }
  .chart-extreme-label { font-size: 11px; font-weight: bold; }
  .chart-extreme-label-high { fill: #ff6b6b; }
  .chart-extreme-label-low { fill: #8bd98b; }
  .chart-tooltip {
    position: absolute;
    pointer-events: none;
    background: #0d0d1a;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 0.85em;
    color: #eee;
    opacity: 0;
    transition: opacity 0.1s ease;
    white-space: nowrap;
    transform: translate(-50%, -115%);
    z-index: 10;
  }
  .chart-tooltip .tt-value { color: #ffd700; font-weight: bold; font-size: 1.1em; }
  .chart-tooltip .tt-label { color: #aaa; }

  @media (max-width: 600px) {
    body { padding: 10px; }
    .card { padding: 28px 16px; border-radius: 10px; }
    h1 { font-size: 1.4em; margin-bottom: 18px; }
    .panel h2 { font-size: 1.1em; }
    .tabs { gap: 8px; }
    .tab-btn { padding: 8px 14px; font-size: 0.9em; }
    .price { font-size: 1.8em; margin: 14px 0; }
    .price-row { margin: 14px 0; }
    .price-block .price { font-size: 1.4em; }
    .label { font-size: 0.82em; }
    table { font-size: 0.85em; }
    th, td { padding: 6px 8px; }
    .chart-tooltip { font-size: 0.8em; padding: 6px 10px; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Today's Rates (Kerala)</h1>

    <div class="tabs">
      <button class="tab-btn gold active" data-tab="gold">Gold</button>
      <button class="tab-btn fuel" data-tab="fuel">Petrol &amp; Diesel</button>
    </div>

    <div class="panel gold active" id="panel-gold">
      <h2>Today's Gold Rate</h2>
      <div id="gold-today-block"><p class="loading">Loading...</p></div>

      <h2 style="margin-top: 30px;">Price Trend (This Month)</h2>
      <div id="gold-chart-block"><p class="loading">Loading...</p></div>

      <h2 style="margin-top: 30px;">This Month's Rates</h2>
      <div id="gold-month-block"><p class="loading">Loading...</p></div>

      <p class="label" id="gold-fetched-at" style="margin-top: 20px;"></p>
    </div>

    <div class="panel fuel" id="panel-fuel">
      <h2>Today's Petrol &amp; Diesel Rate</h2>
      <div id="fuel-today-block"><p class="loading">Loading...</p></div>

      <h2 style="margin-top: 30px;">District-wise Rates</h2>
      <div id="fuel-district-block"><p class="loading">Loading...</p></div>

      <p class="label" id="fuel-fetched-at" style="margin-top: 20px;"></p>
    </div>
  </div>

<script>
// Both data.json and data-fuel.json live in this same repo (written by the
// GitHub Actions workflows), so these are same-origin fetches — no CORS
// problem, no third-party proxy needed.

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
  });
});

function parseRupees(str) {
  if (!str) return null;
  const n = parseInt(String(str).replace(/[^\d]/g, ""), 10);
  return isNaN(n) ? null : n;
}

function niceStep(range, targetTicks) {
  const rough = range / targetTicks;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  let step;
  if (norm < 1.5) step = 1;
  else if (norm < 3) step = 2;
  else if (norm < 7) step = 5;
  else step = 10;
  return step * mag;
}

function renderGoldChart(monthRows) {
  const block = document.getElementById("gold-chart-block");
  const points = monthRows
    .map(r => ({ date: r.date, label: r.label, perGram: r.price_per_gram, value: parseRupees(r.price) }))
    .filter(p => p.value !== null);

  if (points.length < 2) {
    block.innerHTML = `<p class="error">Not enough data to draw a trend chart</p>`;
    return;
  }

  const isNarrow = (block.clientWidth || window.innerWidth) < 500;
  const W = Math.max(300, Math.min(640, block.clientWidth || 640));
  const H = Math.round(W * (isNarrow ? 0.62 : 0.4375));
  const padL = isNarrow ? 62 : 68, padR = 12, padT = 16, padB = 34;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;

  const values = points.map(p => p.value);
  const rawMin = Math.min(...values);
  const rawMax = Math.max(...values);
  const maxIdx = values.indexOf(rawMax);
  const minIdx = values.indexOf(rawMin);
  const step = niceStep((rawMax - rawMin) || rawMax * 0.1, 4);
  const yMin = Math.floor(rawMin / step) * step - step;
  const yMax = Math.ceil(rawMax / step) * step + step;

  const xFor = i => padL + (points.length === 1 ? 0 : (i / (points.length - 1)) * innerW);
  const yFor = v => padT + innerH - ((v - yMin) / (yMax - yMin)) * innerH;

  let gridSvg = "";
  const tickCount = Math.round((yMax - yMin) / step);
  for (let t = 0; t <= tickCount; t++) {
    const v = yMin + t * step;
    const y = yFor(v);
    gridSvg += `<line class="chart-grid" x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" />`;
    gridSvg += `<text class="chart-axis-text" x="${padL - 10}" y="${y + 4}" text-anchor="end">${Math.round(v).toLocaleString("en-IN")}</text>`;
  }

  const maxXTicks = isNarrow ? 4 : 6;
  const spacing = Math.max(1, Math.floor((points.length - 1) / (maxXTicks - 1)));
  const xTickIdx = [];
  for (let i = 0; i < points.length; i += spacing) xTickIdx.push(i);
  const lastPointIdx = points.length - 1;
  const minGapPx = 40;
  if (xTickIdx[xTickIdx.length - 1] !== lastPointIdx) {
    if (xFor(lastPointIdx) - xFor(xTickIdx[xTickIdx.length - 1]) < minGapPx) {
      xTickIdx[xTickIdx.length - 1] = lastPointIdx;
    } else {
      xTickIdx.push(lastPointIdx);
    }
  }

  let xAxisSvg = "";
  xTickIdx.forEach(i => {
    const x = xFor(i);
    const anchor = i === 0 ? "start" : i === lastPointIdx ? "end" : "middle";
    xAxisSvg += `<text class="chart-axis-text" x="${x}" y="${H - padB + 20}" text-anchor="${anchor}">${points[i].date}</text>`;
  });

  const linePath = points.map((p, i) => `${i === 0 ? "M" : "L"} ${xFor(i)} ${yFor(p.value)}`).join(" ");
  const areaPath = `${linePath} L ${xFor(points.length - 1)} ${padT + innerH} L ${xFor(0)} ${padT + innerH} Z`;

  const lastIdx = points.length - 1;
  const lastX = xFor(lastIdx);
  const lastY = yFor(points[lastIdx].value);
  const todaySuffix = lastIdx === maxIdx ? " ▲ Highest" : lastIdx === minIdx ? " ▼ Lowest" : "";
  const lastValueLabel = "Rs. " + Math.round(points[lastIdx].value).toLocaleString("en-IN") + todaySuffix;

  function extremeMarkerSvg(idx, isHigh) {
    if (idx === lastIdx || idx < 0) return "";
    const x = xFor(idx);
    const y = yFor(points[idx].value);
    // Anchor toward the chart's center so the label always grows inward, never off the edge.
    const anchor = idx <= (points.length - 1) / 2 ? "start" : "end";
    const labelX = anchor === "start" ? x + 6 : x - 6;
    const dy = isHigh ? -12 : 18;
    const arrow = isHigh ? "▲" : "▼";
    const valueLabel = "Rs. " + Math.round(points[idx].value).toLocaleString("en-IN");
    const dotCls = isHigh ? "chart-dot-high" : "chart-dot-low";
    const labelCls = isHigh ? "chart-extreme-label chart-extreme-label-high" : "chart-extreme-label chart-extreme-label-low";
    return `
      <circle class="${dotCls}" cx="${x}" cy="${y}" r="5" />
      <text class="${labelCls}" x="${labelX}" y="${y + dy}" text-anchor="${anchor}">${arrow} ${valueLabel}</text>
    `;
  }

  block.innerHTML = `
    <div class="chart-wrap">
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" tabindex="0" aria-label="Gold price trend over the past month, ending at ${lastValueLabel}">
        <defs>
          <linearGradient id="goldAreaGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffd700" stop-opacity="0.22" />
            <stop offset="100%" stop-color="#ffd700" stop-opacity="0" />
          </linearGradient>
        </defs>
        ${gridSvg}
        ${xAxisSvg}
        <path class="chart-area" d="${areaPath}" />
        <path class="chart-line" d="${linePath}" />
        ${extremeMarkerSvg(maxIdx, true)}
        ${extremeMarkerSvg(minIdx, false)}
        <circle class="chart-dot" cx="${lastX}" cy="${lastY}" r="5" />
        <text class="chart-end-label" x="${lastX}" y="${lastY - 12}" text-anchor="end">${lastValueLabel}</text>
        <line class="chart-crosshair" id="gold-crosshair" x1="0" y1="${padT}" x2="0" y2="${padT + innerH}" />
      </svg>
      <div class="chart-tooltip" id="gold-tooltip"></div>
    </div>
  `;

  const svg = block.querySelector(".chart-svg");
  const tooltip = document.getElementById("gold-tooltip");
  const crosshair = document.getElementById("gold-crosshair");

  function showAt(idx) {
    idx = Math.max(0, Math.min(points.length - 1, idx));
    const p = points[idx];
    const px = xFor(idx);
    const py = yFor(p.value);

    crosshair.setAttribute("x1", px);
    crosshair.setAttribute("x2", px);
    crosshair.style.opacity = 1;

    tooltip.innerHTML = "";
    const dateEl = document.createElement("div");
    dateEl.className = "tt-label";
    dateEl.textContent = p.date + (p.label ? " · " + p.label : "");
    const valueEl = document.createElement("div");
    valueEl.className = "tt-value";
    valueEl.textContent = "Rs. " + Math.round(p.value).toLocaleString("en-IN");
    const gramEl = document.createElement("div");
    gramEl.className = "tt-label";
    gramEl.textContent = "Per gram: " + (p.perGram || "-");
    tooltip.appendChild(dateEl);
    tooltip.appendChild(valueEl);
    tooltip.appendChild(gramEl);
    if (idx === maxIdx || idx === minIdx) {
      const extremeEl = document.createElement("div");
      extremeEl.className = idx === maxIdx ? "tt-label chart-extreme-label-high" : "tt-label chart-extreme-label-low";
      extremeEl.textContent = idx === maxIdx ? "▲ Highest of month" : "▼ Lowest of month";
      tooltip.appendChild(extremeEl);
    }

    const rect = svg.getBoundingClientRect();
    tooltip.style.left = (px / W) * rect.width + "px";
    tooltip.style.top = (py / H) * rect.height + "px";
    tooltip.style.opacity = 1;
  }

  function hide() {
    tooltip.style.opacity = 0;
    crosshair.style.opacity = 0;
  }

  svg.addEventListener("pointermove", e => {
    const rect = svg.getBoundingClientRect();
    const svgX = (e.clientX - rect.left) * (W / rect.width);
    const idx = Math.round(((svgX - padL) / innerW) * (points.length - 1));
    showAt(idx);
  });
  svg.addEventListener("pointerleave", hide);
  svg.addEventListener("focus", () => showAt(lastIdx));
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", e => {
    const current = Math.round(((parseFloat(crosshair.getAttribute("x1")) - padL) / innerW) * (points.length - 1));
    if (e.key === "ArrowLeft") { e.preventDefault(); showAt(current - 1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); showAt(current + 1); }
  });
}

let lastGoldMonthRows = null;
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (lastGoldMonthRows) renderGoldChart(lastGoldMonthRows);
  }, 200);
});

async function loadGoldRates() {
  const todayBlock = document.getElementById("gold-today-block");
  const chartBlock = document.getElementById("gold-chart-block");
  const monthBlock = document.getElementById("gold-month-block");
  const fetchedAtEl = document.getElementById("gold-fetched-at");

  try {
    const response = await fetch("data.json?_=" + Date.now()); // cache-bust
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();

    if (data.today) {
      todayBlock.innerHTML = `
        <div class="label">22 Carat &mdash; 1 Pavan (8 grams)</div>
        <div class="price">${data.today.price}</div>
        <div class="label">Per gram: ${data.today.price_per_gram}</div>
        <div class="label">Date: ${data.today.date}</div>
      `;
    } else {
      todayBlock.innerHTML = `<p class="error">No "today" row found in latest data</p>`;
    }

    if (data.month_rows && data.month_rows.length) {
      lastGoldMonthRows = data.month_rows;
      renderGoldChart(data.month_rows);
    } else {
      chartBlock.innerHTML = `<p class="error">No trend data available</p>`;
    }

    const monthValues = data.month_rows.map(row => parseRupees(row.price));
    const validMonthValues = monthValues.filter(v => v !== null);
    const monthMax = validMonthValues.length ? Math.max(...validMonthValues) : null;
    const monthMin = validMonthValues.length ? Math.min(...validMonthValues) : null;
    const maxRowIdx = monthMax !== null ? monthValues.indexOf(monthMax) : -1;
    const minRowIdx = monthMin !== null ? monthValues.indexOf(monthMin) : -1;

    let tableHtml = `
      <div class="table-scroll">
      <table>
        <thead>
          <tr><th>Date</th><th>Time</th><th>Price of 1 Pavan Gold (Rs.)</th><th>Price per Gram (Rs.)</th><th>Note</th></tr>
        </thead>
        <tbody>
    `;
    data.month_rows.forEach((row, i) => {
      const rowClasses = [
        row.label === 'Today' ? 'today-row' : '',
        i === maxRowIdx ? 'high-row' : '',
        i === minRowIdx ? 'low-row' : ''
      ].filter(Boolean).join(' ');
      tableHtml += `
        <tr class="${rowClasses}">
          <td>${row.date}</td>
          <td>${row.label}</td>
          <td>${row.price}</td>
          <td>${row.price_per_gram}</td>
          <td class="note">${row.note}</td>
        </tr>
      `;
    });
    tableHtml += `</tbody></table></div>`;
    monthBlock.innerHTML = tableHtml;

    fetchedAtEl.textContent = "Data last updated: " + data.fetched_at;

  } catch (err) {
    const message = `<p class="error">Could not load gold rate data: ${err.message}</p>`;
    todayBlock.innerHTML = message;
    chartBlock.innerHTML = message;
    monthBlock.innerHTML = message;
  }
}

function changeClass(change) {
  if (!change) return "flat";
  if (change.startsWith("+")) return "up";
  if (change.startsWith("-")) return "down";
  return "flat";
}

async function loadFuelRates() {
  const todayBlock = document.getElementById("fuel-today-block");
  const districtBlock = document.getElementById("fuel-district-block");
  const fetchedAtEl = document.getElementById("fuel-fetched-at");

  try {
    const response = await fetch("data-fuel.json?_=" + Date.now());
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();

    if (data.today) {
      todayBlock.innerHTML = `
        <div class="label">${data.today.district}</div>
        <div class="price-row">
          <div class="price-block">
            <div class="label">Petrol</div>
            <div class="price">Rs. ${data.today.petrol_price}</div>
          </div>
          <div class="price-block">
            <div class="label">Diesel</div>
            <div class="price">Rs. ${data.today.diesel_price}</div>
          </div>
        </div>
      `;
    } else {
      todayBlock.innerHTML = `<p class="error">No "today" district found in latest data</p>`;
    }

    let tableHtml = `
      <div class="table-scroll">
      <table>
        <thead>
          <tr><th>District</th><th>Petrol (Rs.)</th><th>Change</th><th>Diesel (Rs.)</th><th>Change</th></tr>
        </thead>
        <tbody>
    `;
    for (const row of data.districts) {
      const isToday = data.today && row.district === data.today.district;
      tableHtml += `
        <tr class="${isToday ? 'today-row' : ''}">
          <td>${row.district}</td>
          <td>${row.petrol_price ?? "-"}</td>
          <td class="${changeClass(row.petrol_change)}">${row.petrol_change ?? "-"}</td>
          <td>${row.diesel_price ?? "-"}</td>
          <td class="${changeClass(row.diesel_change)}">${row.diesel_change ?? "-"}</td>
        </tr>
      `;
    }
    tableHtml += `</tbody></table></div>`;
    districtBlock.innerHTML = tableHtml;

    fetchedAtEl.textContent = "Data last updated: " + data.fetched_at;

  } catch (err) {
    const message = `<p class="error">Could not load fuel rate data: ${err.message}</p>`;
    todayBlock.innerHTML = message;
    districtBlock.innerHTML = message;
  }
}

loadGoldRates();
loadFuelRates();
</script>
</body>
</html>
